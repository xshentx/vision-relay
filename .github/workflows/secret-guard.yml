name: Update signing key leak guard

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  guard:
    name: Scan tracked files
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject private-key paths
        shell: pwsh
        run: ./tools/check-update-key-leak.ps1 -Scope Tracked
      - name: Reject the configured update signing key
        if: github.event_name == 'push'
        shell: pwsh
        env:
          UPDATE_SIGNING_PRIVATE_KEY_B64: ${{ secrets.UPDATE_SIGNING_PRIVATE_KEY_B64 }}
        run: ./tools/check-update-key-leak.ps1 -Scope Tracked -RequireKnownKey