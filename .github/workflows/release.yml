name: Release desktop apps

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    name: Build Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Prepare Windows resource compiler
        shell: pwsh
        run: |
          $windres = Get-Command windres.exe -ErrorAction SilentlyContinue
          if ($null -eq $windres) {
            $knownPaths = @(
              "C:\msys64\mingw64\bin\windres.exe",
              "C:\msys64\ucrt64\bin\windres.exe",
              "C:\tools\mingw64\bin\windres.exe"
            )
            $windresPath = $knownPaths | Where-Object { Test-Path -LiteralPath $_ -PathType Leaf } | Select-Object -First 1
            if ([string]::IsNullOrWhiteSpace($windresPath)) {
              choco install mingw --yes --no-progress
              if ($LASTEXITCODE -ne 0) {
                throw "Unable to install MinGW-w64."
              }
              $windresPath = Get-ChildItem "C:\tools\mingw64", "C:\ProgramData\chocolatey\lib\mingw" `
                -Filter windres.exe -File -Recurse -ErrorAction SilentlyContinue |
                Select-Object -First 1 -ExpandProperty FullName
            }
            if ([string]::IsNullOrWhiteSpace($windresPath)) {
              throw "windres.exe was not found after installing MinGW-w64."
            }
            Split-Path -Parent $windresPath | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
            & $windresPath --version
          } else {
            & $windres.Source --version
          }
      - name: Build Windows executable
        shell: pwsh
        env:
          WINDOWS_SIGNING_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_BASE64 }}
          WINDOWS_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_SIGNING_CERTIFICATE_BASE64)) {
            throw "WINDOWS_SIGNING_CERTIFICATE_BASE64 is required for public tag releases."
          }
          $certificatePath = Join-Path $env:RUNNER_TEMP "vision-relay-signing.pfx"
          try {
            [IO.File]::WriteAllBytes(
              $certificatePath,
              [Convert]::FromBase64String($env:WINDOWS_SIGNING_CERTIFICATE_BASE64)
            )
            ./tools/build-windows.ps1 `
              -Output dist/vision-relay.exe `
              -Version "${{ github.ref_name }}" `
              -SigningCertificatePath $certificatePath `
              -RequireSignature
          } finally {
            if ($certificatePath) {
              Remove-Item -LiteralPath $certificatePath -Force -ErrorAction SilentlyContinue
            }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: vision-relay-windows
          path: |
            dist/vision-relay.exe
            dist/vision-relay.exe.sha256
          if-no-files-found: error

  macos:
    name: Build macOS Universal
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build Universal macOS app
        shell: bash
        run: bash ./tools/build-macos.sh --version "${{ github.ref_name }}" --arch universal
      - uses: actions/upload-artifact@v4
        with:
          name: vision-relay-macos
          path: |
            dist/vision-relay-darwin-universal.zip
            dist/vision-relay-darwin-universal.zip.sha256
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [windows, macos]
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Create release and upload desktop packages
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release-assets/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$RELEASE_TAG" release-assets/* \
              --title "Vision Relay $RELEASE_TAG" \
              --generate-notes \
              --repo "$GITHUB_REPOSITORY"
          fi
