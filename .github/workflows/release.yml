name: Release desktop apps

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  security:
    name: Test and vulnerability scan
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go test ./...
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - run: govulncheck ./...

  windows:
    needs: security
    name: Build Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Prepare Windows resource compiler
        shell: pwsh
        run: |
          $windres = Get-Command windres.exe -ErrorAction SilentlyContinue
          if ($null -eq $windres) {
            $knownPaths = @(
              "C:\msys64\mingw64\bin\windres.exe",
              "C:\msys64\ucrt64\bin\windres.exe",
              "C:\tools\mingw64\bin\windres.exe"
            )
            $windresPath = $knownPaths | Where-Object { Test-Path -LiteralPath $_ -PathType Leaf } | Select-Object -First 1
            if ([string]::IsNullOrWhiteSpace($windresPath)) {
              choco install mingw --yes --no-progress
              if ($LASTEXITCODE -ne 0) {
                throw "Unable to install MinGW-w64."
              }
              $windresPath = Get-ChildItem "C:\tools\mingw64", "C:\ProgramData\chocolatey\lib\mingw" `
                -Filter windres.exe -File -Recurse -ErrorAction SilentlyContinue |
                Select-Object -First 1 -ExpandProperty FullName
            }
            if ([string]::IsNullOrWhiteSpace($windresPath)) {
              throw "windres.exe was not found after installing MinGW-w64."
            }
            Split-Path -Parent $windresPath | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
            & $windresPath --version
          } else {
            & $windres.Source --version
          }
      - name: Build and verify signed Windows executable
        shell: pwsh
        env:
          UPDATE_SIGNING_PRIVATE_KEY_B64: ${{ secrets.UPDATE_SIGNING_PRIVATE_KEY_B64 }}
        run: |
          $keyPath = $null
          try {
            if ([string]::IsNullOrWhiteSpace($env:UPDATE_SIGNING_PRIVATE_KEY_B64)) {
              throw "UPDATE_SIGNING_PRIVATE_KEY_B64 is required for Windows releases."
            }
            ./tools/check-update-key-leak.ps1 -Scope Tracked -RequireKnownKey
            $keyPath = Join-Path $env:RUNNER_TEMP "vision-relay-update-key.txt"
            Set-Content -LiteralPath $keyPath -Value $env:UPDATE_SIGNING_PRIVATE_KEY_B64 -Encoding ascii -NoNewline
            $env:UPDATE_SIGNING_PRIVATE_KEY_B64 = $null

            ./tools/build-windows.ps1 `
              -Output dist/vision-relay.exe `
              -Version "${{ github.ref_name }}" `
              -UpdateSigningPrivateKeyPath $keyPath `
              -RequireUpdateSignature

            $artifacts = @(
              "dist/vision-relay.exe",
              "dist/vision-relay.exe.sha256",
              "dist/vision-relay.exe.sig"
            )
            foreach ($artifact in $artifacts) {
              if (-not (Test-Path -LiteralPath $artifact -PathType Leaf)) {
                throw "Required signed release artifact is missing: $artifact"
              }
            }
            ./tools/check-update-key-leak.ps1 `
              -Scope Paths `
              -KeyFile $keyPath `
              -Paths $artifacts `
              -RequireKnownKey
          } finally {
            $env:UPDATE_SIGNING_PRIVATE_KEY_B64 = $null
            if (-not [string]::IsNullOrWhiteSpace($keyPath)) {
              [IO.File]::Delete($keyPath)
            }
          }

      - uses: actions/upload-artifact@v4
        with:
          name: vision-relay-windows
          path: |
            dist/vision-relay.exe
            dist/vision-relay.exe.sha256
            dist/vision-relay.exe.sig
          if-no-files-found: error

  macos:
    needs: security
    name: Build macOS Universal
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build Universal macOS app
        shell: bash
        run: bash ./tools/build-macos.sh --version "${{ github.ref_name }}" --arch universal
      - uses: actions/upload-artifact@v4
        with:
          name: vision-relay-macos
          path: |
            dist/vision-relay-darwin-universal.zip
            dist/vision-relay-darwin-universal.zip.sha256
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [windows, macos]
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Create release and upload desktop packages
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release-assets/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$RELEASE_TAG" release-assets/* \
              --title "Vision Relay $RELEASE_TAG" \
              --generate-notes \
              --repo "$GITHUB_REPOSITORY"
          fi
